name: Continuous Integration & Testing

on:
  pull_request:
    branches:
      - main

jobs:
  test-business-server:
    name: Test Business Server (Spring Boot 3.4 / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Maven Tests
        run: ./mvnw clean test

  test-multi-agent-server:
    name: Test Multi-Agent AI Server (Python 3.11 / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-agent-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Pytest Test Suite
        run: poetry run pytest tests/test_report_analysis.py

  test-client:
    name: Test Web Client (Next.js / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compiler Verification
        run: npx tsc --noEmit

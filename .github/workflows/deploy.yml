name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deployment of all services'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'lak-chemicals' }}
  REGION: asia-south1
  GAR_REPOSITORY: lak-chemicals-prod-repo
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  filter:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      business: ${{ steps.changes.outputs.business == 'true' || github.event.inputs.force_deploy_all == 'true' || github.event_name == 'workflow_dispatch' }}
      ai_service: ${{ steps.changes.outputs.ai_service == 'true' || github.event.inputs.force_deploy_all == 'true' || github.event_name == 'workflow_dispatch' }}
      client: ${{ steps.changes.outputs.client == 'true' || github.event.inputs.force_deploy_all == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            business:
              - 'business-server/**'
            ai_service:
              - 'multi-agent-server/**'
            client:
              - 'client/**'

  # ============================================================================
  # Continuous Integration (CI) Testing Gates
  # ============================================================================
  test-business-server:
    name: CI Test - Business Server (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Maven Tests
        run: ./mvnw clean test

  test-multi-agent-server:
    name: CI Test - Multi-Agent Server (FastAPI / LangGraph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-agent-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Pytest Test Suite
        run: poetry run pytest tests/test_report_analysis.py

  test-client:
    name: CI Test - Web Client (Next.js / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  # ============================================================================
  # Continuous Deployment (CD) - Gated by CI Testing
  # ============================================================================
  deploy-business-server:
    name: Deploy Business Server (Spring Boot)
    needs: [filter, test-business-server]
    if: needs.filter.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/business-server:${{ github.sha }}
          LATEST_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/business-server:latest
        run: |
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./business-server
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lak-chemicals-prod-business \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/business-server:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

  deploy-ai-service:
    name: Deploy Multi-Agent Server (FastAPI)
    needs: [filter, test-multi-agent-server]
    if: needs.filter.outputs.ai_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/ai-service:${{ github.sha }}
          LATEST_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/ai-service:latest
        run: |
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./multi-agent-server
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lak-chemicals-prod-ai-service \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/ai-service:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

  deploy-client:
    name: Deploy Web Client (Next.js)
    needs: [filter, test-client]
    if: needs.filter.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/client:${{ github.sha }}
          LATEST_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/client:latest
        run: |
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./client
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lak-chemicals-prod-web \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/client:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

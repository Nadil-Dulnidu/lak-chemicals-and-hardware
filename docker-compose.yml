version: "3.9"

services:
  business-server:
    build:
      context: ./business-server
      dockerfile: Dockerfile
    container_name: lak-business-server
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_BASE_URL=http://multi-agent-server:8001
    restart: unless-stopped

  multi-agent-server:
    build:
      context: ./multi-agent-server
      dockerfile: Dockerfile
    container_name: lak-multi-agent-server
    ports:
      - "8001:8001"
    environment:
      - BUSINESS_SERVER_BASE_URL=http://business-server:8000
    depends_on:
      - business-server
    restart: unless-stopped

server:
  port: ${PORT:8000}

spring:
  application:
    name: business-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lak_chemicals}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Clerk configuration
clerk:
  jwks-url: ${CLERK_JWKS_URL:https://delicate-civet-49.clerk.accounts.dev/.well-known/jwks.json}
  issuer: ${CLERK_ISSUER:https://delicate-civet-49.clerk.accounts.dev}

# Inter-service authentication
app:
  api-key: ${API_KEY:}
  api-key-header: ${API_KEY_HEADER:x-api-key}
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "https://lakchemicalsandhardware.vercel.app"

# Stripe configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  frontend-url: ${STRIPE_FRONTEND_URL:http://localhost:3000}

# Google Cloud Storage
gcp:
  storage:
    bucket-name: ${GCS_BUCKET_NAME:lak-chemicals-products}
    public-url-prefix: ${GCS_PUBLIC_URL_PREFIX:https://storage.googleapis.com/lak-chemicals-products}

# AI Service (Multi-Agent Server)
ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  api-key: ${AI_SERVICE_API_KEY:}

# OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
